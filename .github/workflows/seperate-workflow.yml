    #     sed -i "s|__AWS_ACCOUNT_ID__|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/deployment.yml
    #     sed -i "s|__IMAGE_TAG__|${IMAGE_TAG}|g" k8s/deployment.yml

